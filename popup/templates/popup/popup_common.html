<style>
    /* ---- Popup/Modale sobre et accessible ---- */
    /* ---- Sober and accessible popup/modal ---- */

    .customPopup {
        visibility: hidden;
        position: fixed;
        inset: 0;
        z-index: 1050;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: visibility 0ms linear 0.25s;
    }

    .customPopup.showed {
        visibility: visible;
        transition: visibility 0ms;
    }

    .customPopup .customPopup-content{
        width:40%;
        min-height:10%;
        min-width:400px;
    }

    /* Fond semi-transparent / Semi-transparent backdrop */
    .customPopup-bg {
        position: absolute;
        inset: 0;
        background-color: rgba(0, 0, 0, 0.4);
        opacity: 0;
        transition: opacity 0.25s ease;
    }

    .customPopup.showed .customPopup-bg {
        opacity: 1;
    }

    /* Contenu de la modale / Modal content */
    .customPopup-content {
        position: relative;
        z-index: 1;
        width: 92%;
    {#max-width: 540px;#}
        max-height: 85vh;
        overflow-y: auto;
        padding: 2rem 1.75rem 1.5rem;
        background-color: #fff;
        border-radius: 16px;
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.12);
        transform: translateY(12px) scale(0.97);
        opacity: 0;
        transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1),
        opacity 0.25s ease;
    }

    .customPopup.showed .customPopup-content {
        transform: translateY(0) scale(1);
        opacity: 1;
    }

    /* ---- Style des formulaires dans la modale ---- */
    /* ---- Form styles inside the modal ---- */

    /* Titre du formulaire / Form title */
    .customPopup-content h2 {
        font-size: 1.15rem;
        font-weight: 600;
        color: #202124;
        margin-bottom: 1.25rem;
        padding-bottom: 0.75rem;
        border-bottom: 1px solid #e8eaed;
    }

    /* Labels / Labels */
    .customPopup-content p.explanation{
        font-size: 0.85rem;
        color: #5f6368;
    }


    /* Messages d'erreur / Error messages */
    .customPopup-content .error {
        font-size: 0.78rem;
        color: #dc3545;
        margin-top: 0.25rem;
        margin-bottom: 0.5rem;
    }

    /* ---- Barre de boutons en bas du formulaire ---- */
    /* ---- Button bar at the bottom of the form ---- */

    /* Responsive mobile / Mobile responsive */
    @media (max-width: 768px) {
        .customPopup .customPopup-content {
            width: 96%;
            max-width: none;
            padding: 1.5rem 1.25rem 1.25rem;
            border-radius: 14px;
            max-height: 90vh;
            min-width:auto;
        }
    }

</style>

<script>
    function openPopup(name, width){
        if (width!=="None"){
            document.querySelector('#customPopup-content-'+name).style.width = width
        }
        let popup = document.querySelector("#customPopup-"+name)
        popup.classList.add("showed")
    }

    function closePopup(name){
        let popup = document.querySelector("#customPopup-"+name)
        popup.classList.remove("showed")
    }

    function scrollToTopContent(name){
        document.querySelector('#customPopup-content').scrollTo({top: 0, behavior: 'smooth'})
    }
</script>
